ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.aiocc.ApplicationKt.module ]
    }
}

db {
    url = "jdbc:mysql://localhost:3306/aiocc_db"
    url = ${?DB_URL}
    driver = "com.mysql.cj.jdbc.Driver"
    driver = ${?DB_DRIVER}
    user = "root"
    user = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
}

jwt {
    secret = ${?JWT_SECRET}
    issuer = "http://localhost:8080/"
    audience = "http://localhost:8080/api"
    realm = "AIOCC Management System"
}